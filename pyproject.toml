[project]
name = "hwctl"
version = "0.0.0"
description = "Simulation-first agentic hardware control: Claude builds breadboard circuits"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "pillow>=10",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=1.2",
    "anthropic>=0.50",
]

[project.optional-dependencies]
cv = ["opencv-python-headless>=4.9"]
pi = ["gpiozero>=2.0"]
serial = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
markers = ["ngspice: needs the ngspice binary"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwctl"]
